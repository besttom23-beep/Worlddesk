name: Refresh briefing and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 00:17, 06:17, 12:17, 18:17 UTC; scheduled runs can be delayed by GitHub.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: world-desk-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Recover the last published edition
        run: node scripts/restore-published.mjs
        env:
          PUBLISHED_URL: ${{ steps.pages.outputs.base_url }}
      - name: Fetch current headlines
        run: npm run refresh
      - name: Verify data and behavior
        run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
